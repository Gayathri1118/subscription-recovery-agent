version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: recovery_agent_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: recovery
      POSTGRES_PASSWORD: recovery
      POSTGRES_DB: recovery_agent
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./app/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recovery -d recovery_agent"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
