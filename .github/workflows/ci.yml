name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: recovery
          POSTGRES_PASSWORD: recovery
          POSTGRES_DB: recovery_agent
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U recovery -d recovery_agent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg2://recovery:recovery@localhost:5432/recovery_agent
      RANDOM_SEED: 7
      NUM_FAILURE_EVENTS: 80
      MAX_AUTOMATED_AMOUNT: 5000
      MAX_RETRY_ATTEMPTS: 3

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Apply schema
        run: PGPASSWORD=recovery psql -h localhost -U recovery -d recovery_agent -f app/schema.sql

      - name: Seed synthetic batch
        run: python -m data.generate_synthetic

      - name: Run tests
        run: pytest tests/ -v -m "not requires_groq"
